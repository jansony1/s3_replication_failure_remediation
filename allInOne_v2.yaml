AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  Region:
    Type: String
    Description: Target Region
    Default: us-west-2
  CSVBucket:
    Type: String
    Description: S3 bucket to store objects to be deleted
  AccountId:
    Type: String
    Description: Deployed Account ID
  DDBTable:
    Type: String
    Description: DDB table for failed replicated objects
  SourceBucket:
    Type: String
    Default: ""
    Description: >-
      Optional. If set, the replication-failure event notification is wired
      onto this source bucket automatically. Leave empty to keep the manual
      multi-bucket mode (configure put-bucket-notification-configuration
      yourself for each source bucket).

Conditions:
  HasSourceBucket: !Not [!Equals [!Ref SourceBucket, ""]]

Resources:
  ReplicationDLQ:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: "ReplicationFailureDLQ"
      MessageRetentionPeriod: 1209600  # 14 days, max retention for inspection
  ReplicationQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: "ReplicationFailureQueue"
      VisibilityTimeout: 600
      # Messages that fail Lambda processing 5x land in the DLQ instead of
      # being redelivered forever.
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReplicationDLQ.Arn
        maxReceiveCount: 5
  ReplicationQueueMyQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ReplicationQueue  # Reference to your SQS queue
      PolicyDocument:
        Version: "2012-10-17"
        Id: "__default_policy_ID"
        Statement:
          - Sid: "__owner_statement"
            Effect: "Allow"
            Principal:
              AWS: !Sub "arn:aws:iam::${AccountId}:root"
            Action: "SQS:*"
            Resource: !GetAtt ReplicationQueue.Arn
          - Sid: "example-statement-ID"
            Effect: "Allow"
            Principal:
              Service: "s3.amazonaws.com"
            Action: "SQS:SendMessage"
            Resource: !GetAtt ReplicationQueue.Arn
            Condition:
              StringEquals: 
                "aws:SourceAccount": !Sub ${AccountId}
  S3ReplicationFailureTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: !Ref DDBTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: 'BucketRuleKey'
          AttributeType: 'S'
        - AttributeName: 'ObjectKeyVersionId'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'BucketRuleKey'
          KeyType: 'HASH'
        - AttributeName: 'ObjectKeyVersionId'
          KeyType: 'RANGE'

  FailureIngestionLambda:
    Type: "AWS::Lambda::Function"
    Properties:
      Handler: "index.lambda_handler"
      Role: !GetAtt FailureIngestionLambdaRole.Arn
      Code: 
        ZipFile: |
          import json
          import boto3
          import random
          import os

           # Initialize the DynamoDB client
          dynamodb = boto3.resource('dynamodb')
          # Specify your DynamoDB table name
          table_name = os.environ['table_name']
          table = dynamodb.Table(table_name)

          def lambda_handler(event, context):
              print(event)
              total = 0
              sqs_records = event.get('Records',{})
              for sqs_record in sqs_records:

                  message_body_str = sqs_record.get('body',{})
                  message_body = json.loads(message_body_str)
                  #print("message_body:"+ message_body_str)
                  event_record = message_body.get('Records',[])
                  #print("event_records:"+ json.dumps(event_record))
                  
                  if not event_record:
                      continue

                  record = event_record[0]
                  # Get necessary info for records ingestion.
                  s3_info = record.get('s3', {})
                  replication_event_data = record.get('replicationEventData', {})
                  # Extract the necessary information
                  src_bucket_name = s3_info.get('bucket', {}).get('name')
                  object_info = s3_info.get('object', {})
                  object_key = object_info.get('key')
                  versionId = object_info.get('versionId')
                  replication_rule_id = replication_event_data.get('replicationRuleId')
                  failure_reason = replication_event_data.get('failureReason')
                  dst_bucket_arn = replication_event_data.get('destinationBucket')

                  parts = dst_bucket_arn.split(':')
                  dst_bucket_name = parts[-1]

                  
                  # Keep Version infor
                  object_key_with_version = object_key +"#"+ versionId
                  
                  # Create an item to insert into DynamoDB
                  item = {
                      'BucketRuleKey': src_bucket_name + '|' + replication_rule_id,
                      'ObjectKeyVersionId': object_key_with_version,
                      'SRCBucketName': src_bucket_name,
                      'ReplicationRuleId': replication_rule_id,
                      'DSTBucketName' : dst_bucket_name,
                      'FailureReason': failure_reason
                  }

                  # Optionally add other object attributes like size, etag, etc.
                  item.update({
                      'ObjectSize': object_info.get('size'),
                      'ETag': object_info.get('eTag'),
                      'VersionId': object_info.get('versionId')
                  })

                  # Write the item to the DynamoDB table
                  table.put_item(Item=item)

              return {
                  'statusCode': 200,
                  'body': json.dumps('Records ingested into DynamoDB successfully')
              }
    
      Runtime: python3.12
      Timeout: 600
      Environment:
        Variables:
          table_name: !Ref DDBTable
  FailureIngestionLambdaEventSourceMapping:
    Type: "AWS::Lambda::EventSourceMapping"
    Properties:
      BatchSize: 10  # 一次处理的消息数量，可以根据需求调整
      EventSourceArn: !GetAtt ReplicationQueue.Arn  # SQS 队列的 ARN
      FunctionName: !GetAtt FailureIngestionLambda.Arn  # Lambda 函数的 ARN

  FailureIngestionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Sub arn:aws:dynamodb:${Region}:${AccountId}:table/${DDBTable}
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReplicationQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${Region}:${AccountId}:log-group:/aws/lambda/*

  ProcessAndStartCopyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt ProcessAndStartCopyRole.Arn
      Runtime: python3.12
      Timeout: 600
      # This function loads all failure items for a rule into memory before
      # building the CSV manifest. 2048MB sizes it for large failure sets;
      # see README "Capacity" for how many objects this supports.
      MemorySize: 2048
      Environment:
        Variables:
          region: !Ref Region
          table_name: !Ref DDBTable
          csv_bucket: !Ref CSVBucket
          account_id: !Ref AccountId
          replication_role: !GetAtt BatchReplicationJobRole.Arn
      Code:
        ZipFile: |
          import boto3
          import csv
          import os
          import json
          import time
          from io import StringIO
          from botocore.exceptions import ClientError
          import logging
          import boto3

          # Configure logger
          logger = logging.getLogger()
          logger.setLevel(logging.ERROR)

          # Initialize boto3 clients for DynamoDB and S3
          dynamodb = boto3.resource('dynamodb')
          s3 = boto3.client('s3')
          # For batch replication
          s3_control_client = boto3.client('s3control')

          # Change below parameters, when invoke lambda via env overide
          table_name = os.environ['table_name']
          csv_bucket = os.environ['csv_bucket']
          account_id = os.environ['account_id']
          replication_role =  os.environ['replication_role']
          #replication_rule = os.environ['replication_rule']


          def one_time_batch(target_file_lists, etag):

              try:
                  response = s3_control_client.create_job(
                      AccountId=account_id,
                      Operation={
                          'S3ReplicateObject': {}
                      },
                      Report={
                          'Bucket': 'arn:aws:s3:::' + csv_bucket,
                          'Format': 'Report_CSV_20180820',
                          'Enabled': True,
                          'Prefix': 'report/',
                          'ReportScope': 'AllTasks'
                      },
                      Manifest={
                          'Spec': {
                              'Format': 'S3BatchOperations_CSV_20180820',
                              'Fields': ['Bucket', 'Key', 'VersionId']
                          },
                          'Location': {
                              'ObjectArn': 'arn:aws:s3:::'+ csv_bucket+'/'+ target_file_lists,
                              'ETag': etag
                          }
                      },
                      Priority=10,
                      ConfirmationRequired=False,
                      RoleArn=replication_role
                  )

                  # Handle response or further processing here
                  print("Job created successfully: ", response)

                  return  response['JobId']
              except ClientError as e:
                  # Surface to Step Functions Catch -> JobFailed instead of swallowing.
                  print("AWS ClientError occurred: ", e)
                  raise
              except Exception as e:
                  # Surface to Step Functions Catch -> JobFailed instead of swallowing.
                  print("An error occurred: ", e)
                  raise


          def lambda_handler(event, context):
              replication_rule = event.get('ReplicationRuleId')
              src_bucket = event.get('SourceBucket')

              if not replication_rule or not src_bucket:
                  raise ValueError("ReplicationRuleId and SourceBucket are required")



              # Reference to your DynamoDB table
              table = dynamodb.Table(table_name)

              # 初始化存储所有查询结果的列表
              all_items = []
              

              # Query the table by composite key
              composite_key = src_bucket + '|' + replication_rule
              kwargs = {
                  'KeyConditionExpression': 'BucketRuleKey = :key',
                  'ExpressionAttributeValues': {':key': composite_key},
                  'ProjectionExpression': 'BucketRuleKey, ObjectKeyVersionId, SRCBucketName'
              }
              
              while True:
                  #paginate automatically up to 1MB
                  try:
                      response = table.query(**kwargs)
                  except Exception as e:
                      logger.error(f"DynamoDB query: {e}")
                      raise e
                  
                  items = response.get('Items', [])
                  print("items are: " + json.dumps(items))
                  if not items:
                      break
                  
                  all_items.extend(items)
                      
                  last_key = response.get('LastEvaluatedKey')
                  if not last_key:
                      break
              
                  kwargs['ExclusiveStartKey'] = last_key


              # No failures recorded for this bucket+rule: nothing to remediate.
              # S3 Batch rejects an empty manifest, so no-op instead of creating
              # a doomed job.
              if not all_items:
                  print("No failure records for " + composite_key + "; nothing to do.")
                  return {
                      "statusCode": 200,
                      "job_id": None,
                      "s3_bucket": csv_bucket,
                      "account_id": account_id,
                      "table_name": table_name,
                      "s3_file_key_to_delete": None,
                      "body": json.dumps("No failures to remediate for " + composite_key)
                  }

              # Create a CSV file in memory
              csv_file = StringIO()
              writer = csv.writer(csv_file)

               # Create items list and store to s3 for delete due to Step Function 256K limitaion.
              to_delete_csv = StringIO()
              to_delete_writer = csv.writer(to_delete_csv)


              # Set for duplicate data manipulation
              unique_rows_csv = set()
              unique_rows_to_delete_csv = set()

              
              # Write the data rows
              for item in all_items:
                  object_key, version_id = item.get('ObjectKeyVersionId', '').split('#', 1)
                  row_bucket = item.get('SRCBucketName', '')
                  unique_rows_csv.add((row_bucket, object_key, version_id))
                  unique_rows_to_delete_csv.add((item.get('BucketRuleKey', ''), item.get('ObjectKeyVersionId', '')))
              
             
              # Ingest data to CSV
              for row in unique_rows_csv:
                  writer.writerow(row)

              # Ingest data to CSV
              for row in unique_rows_to_delete_csv:
                  to_delete_writer.writerow(row)
              
              # Reset the file pointer to the beginning
              csv_file.seek(0)  
              to_delete_csv.seek(0)
              
              # Filename-safe composite scope so two buckets sharing a rule id
              # do not overwrite each other's manifests.
              file_scope = src_bucket + "__" + replication_rule
              s3_file_key = file_scope + ".csv"
              s3_file_key_to_delete = file_scope + "_delete.csv"
              
              # Upload both CSVs; on failure, let the exception propagate so the
              # Step Functions Catch routes the execution to JobFailed.
              # First put_object call
              s3_response = s3.put_object(Bucket=csv_bucket, Key=s3_file_key, Body=csv_file.getvalue())
              # S3 returns the ETag wrapped in double quotes; S3 Control's manifest
              # validation expects the bare value.
              etag = s3_response.get('ETag', '').strip('"')

              print("CSV file upload successfully: ", s3_response)

              # Second put_object call
              s3_to_delete_response = s3.put_object(Bucket=csv_bucket, Key=s3_file_key_to_delete, Body=to_delete_csv.getvalue())

              print("To be deleted ddb object list uploaded successfully: ", s3_to_delete_response)

              # Report Generation; raises on failure (caught by Step Functions).
              job_id = one_time_batch(s3_file_key, etag)

              response = {
                  "statusCode": 200,
                  "s3_bucket": csv_bucket,
                  "job_id": job_id,
                  "account_id": account_id,
                  "table_name": table_name,
                  "s3_file_key_to_delete": s3_file_key_to_delete,
                  'body': json.dumps(f' ontime batch for replication id {replication_rule} success' )
              }

              return response

  ProcessAndStartCopyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProcessAndStartCopyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                Resource: !Sub 'arn:aws:s3:::${CSVBucket}/*'
              - Effect: Allow
                Action:
                  - 'dynamodb:Query'
                Resource: !Sub 'arn:aws:dynamodb:${Region}:${AccountId}:table/${DDBTable}'
              - Effect: Allow
                Action:
                  - 's3:CreateJob'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource: !GetAtt  BatchReplicationJobRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': 's3.amazonaws.com'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${Region}:${AccountId}:*'

  CheckCopyStatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt CheckCopyStatusRole.Arn
      Runtime: python3.12
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3

          # Initialize the S3 Control client
          s3_control_client = boto3.client('s3control')

          def lambda_handler(event, context):
              job_id = event.get("job_id")
              s3_bucket = event.get("s3_bucket")
              s3_file_key_to_delete = event.get('s3_file_key_to_delete')

              account_id = event.get("account_id")  # Replace with a constant if necessary

              # Get the job response from S3 Control
              job_response = s3_control_client.describe_job(
                  AccountId=account_id,
                  JobId=job_id
              )

              # Extract status and number of failed tasks. ProgressSummary may be
              # absent for early states (New/Preparing), so default safely.
              status = job_response['Job']['Status']
              progress = job_response['Job'].get('ProgressSummary') or {}
              failed_task = progress.get('NumberOfTasksFailed', 0)

              # Terminal job states that are not a clean success.
              terminal_failed = ('Failed', 'Cancelled', 'Cancelling', 'Suspended')

              # Determine the job status
              if status == 'Complete' and failed_task == 0:
                  job_status = 'SUCCEEDED'
              elif status in terminal_failed or failed_task != 0:
                  job_status = 'FAILED'
              else:
                  print("Job is still processing. Current status: " + status)
                  job_status = 'ongoing'
              
              # Return the job status
              return {
                  "CopyStatus": job_status
              }

  CheckCopyStatusRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CheckCopyStatusPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:DescribeJob
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${Region}:${AccountId}:*'

          
  DeleteDynamoDBRecordsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt DeleteDynamoDBRecordsRole.Arn
      Runtime: python3.12
      Timeout: 600
      Code:
        ZipFile: |
          import json
          import boto3
          import csv
          from io import StringIO

          # Initialize boto3 clients for DynamoDB and S3
          dynamodb = boto3.resource('dynamodb')
          s3_client = boto3.client('s3')

          # Ensure these environment variables are defined in your Lambda configuration

          def delete_batch(items_to_delete, table_name):
              table = dynamodb.Table(table_name)
              with table.batch_writer() as batch:
                  for key in items_to_delete:
                      batch.delete_item(Key=key)

          def lambda_handler(event, context):
              # Ensure these are passed in the event
              s3_bucket = event.get("s3_bucket")
              s3_file_key_to_delete = event.get('s3_file_key_to_delete')
              table_name = event.get('table_name')

              all_items = []  # Define all_items outside the try block

              try:
                  # Get the object from S3
                  s3_object = s3_client.get_object(Bucket=s3_bucket, Key=s3_file_key_to_delete)
                  s3_file_content = s3_object['Body'].read().decode('utf-8')
                  
                  # Read the CSV content
                  csv_file = StringIO(s3_file_content)
                  reader = csv.reader(csv_file)

                  # Skip the header if your CSV has one
                  # next(reader, None)  # Uncomment this line if your CSV has a header

                  # Read each row in the CSV file
                  for row in reader:
                      # Skip blank/malformed rows (need both key columns).
                      if len(row) < 2:
                          print("Skipping malformed delete row: " + str(row))
                          continue
                      item = {
                          'BucketRuleKey': row[0],
                          'ObjectKeyVersionId': row[1]
                      }
                      all_items.append(item)
              
              except Exception as e:
                  print(f"Error reading from S3: {e}")
                  return {
                      'statusCode': 400,
                      'body': json.dumps(f'Error reading from S3: {e}')
                  }

              # Only call delete_batch if all_items is not empty
              if all_items:
                  delete_batch(all_items, table_name)

              return {
                  'statusCode': 200,
                  'body': json.dumps('delete all records succeed')
              }

  DeleteDynamoDBRecordsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeleteDynamoDBRecordsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource: !Sub "arn:aws:dynamodb:${Region}:${AccountId}:table/${DDBTable}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${CSVBucket}/*"
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${Region}:${AccountId}:*'
             
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ProcessAndStartCopyFunction.Arn
                  - !GetAtt CheckCopyStatusFunction.Arn
                  - !GetAtt DeleteDynamoDBRecordsFunction.Arn

  MyStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString:
        !Sub |
          {
            "Comment": "A Step Function state machine that handles the entire process including passing specific parameters between states.",
            "TimeoutSeconds": 86400,
            "StartAt": "ProcessAndStartCopy",
            "States": {
              "ProcessAndStartCopy": {
                "Type": "Task",
                "Resource": "${ProcessAndStartCopyFunction.Arn}",
                "ResultPath": "$",
                "Next": "HasJob",
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.TaskFailed"
                    ],
                    "ResultPath": "$.errorInfo",
                    "Next": "JobFailed"
                  }
                ]
              },
              "HasJob": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.job_id",
                    "IsNull": true,
                    "Next": "NothingToRemediate"
                  }
                ],
                "Default": "CheckCopyStatus"
              },
              "NothingToRemediate": {
                "Type": "Succeed"
              },
              "CheckCopyStatus": {
                "Type": "Task",
                "Resource": "${CheckCopyStatusFunction.Arn}",
                "InputPath": "$",
                "ResultPath": "$.CopyStatusResult",
                "Next": "IsCopySuccessful",
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.TaskFailed"
                    ],
                    "ResultPath": "$.errorInfo",
                    "Next": "JobFailed"
                  }
                ]
              },
              "IsCopySuccessful": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.CopyStatusResult.CopyStatus",
                    "StringEquals": "SUCCEEDED",
                    "Next": "DeleteDynamoDBRecords"
                  },
                  {
                    "Variable": "$.CopyStatusResult.CopyStatus",
                    "StringEquals": "FAILED",
                    "Next": "JobFailed"
                  }
                ],
                "Default": "WaitAndCheckAgain"
              },
              "WaitAndCheckAgain": {
                "Type": "Wait",
                "Seconds": 10,
                "Next": "CheckCopyStatus"
              },
              "DeleteDynamoDBRecords": {
                "Type": "Task",
                "Resource": "${DeleteDynamoDBRecordsFunction.Arn}",
                "InputPath": "$",
                "End": true,
                "Catch": [
                  {
                    "ErrorEquals": [
                      "States.TaskFailed"
                    ],
                    "ResultPath": "$.errorInfo",
                    "Next": "JobFailed"
                  }
                ]
              },
              "JobFailed": {
                "Type": "Fail",
                "Cause": "States.TaskFailed",
                "Error": "See errorInfo for the failed step"
              }
            }
          }

  BatchReplicationJobRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "batchoperations.s3.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "MyIAMPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "s3:InitiateReplication"
                Resource: 
                  - "*"
              - Effect: "Allow"
                Action:
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                Resource: 
                  - !Sub "arn:aws:s3:::${CSVBucket}/*"
              - Effect: "Allow"
                Action:
                  - "s3:PutObject"
                Resource: 
                  - !Sub "arn:aws:s3:::${CSVBucket}/*"
              - Effect: "Allow"
                Action:
                  - "s3:GetReplicationConfiguration"
                  - "s3:PutInventoryConfiguration"
                Resource: 
                  - "*"
              - Effect: "Allow"
                Action:
                  - "s3:PutObject"
                Resource:
                  - !Sub "arn:aws:s3:::${CSVBucket}/*"

  # --- Optional auto-wiring of the source bucket notification (#8) ---
  # Only created when the SourceBucket parameter is provided. S3 has no native
  # CloudFormation way to add a notification to a pre-existing bucket, so a
  # custom resource calls put-bucket-notification-configuration on create and
  # clears it on delete.
  NotificationConfigRole:
    Type: AWS::IAM::Role
    Condition: HasSourceBucket
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NotificationConfigPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: !Sub "arn:aws:s3:::${SourceBucket}"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${Region}:${AccountId}:*"

  NotificationConfigFunction:
    Type: AWS::Lambda::Function
    Condition: HasSourceBucket
    Properties:
      Handler: index.lambda_handler
      Role: !GetAtt NotificationConfigRole.Arn
      Runtime: python3.12
      Timeout: 120
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request

          s3 = boto3.client('s3')

          def send(event, context, status, reason=""):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f"See CloudWatch log {context.log_stream_name}",
                  'PhysicalResourceId': event.get('PhysicalResourceId', context.log_stream_name),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': {}
              }).encode('utf-8')
              req = urllib.request.Request(
                  event['ResponseURL'], data=body, method='PUT',
                  headers={'content-type': '', 'content-length': str(len(body))}
              )
              urllib.request.urlopen(req)

          def lambda_handler(event, context):
              props = event['ResourceProperties']
              bucket = props['SourceBucket']
              queue_arn = props['QueueArn']
              try:
                  if event['RequestType'] == 'Delete':
                      # Best effort: clear the notification we set.
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket, NotificationConfiguration={}
                      )
                  else:
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={
                              'QueueConfigurations': [{
                                  'QueueArn': queue_arn,
                                  'Events': ['s3:Replication:OperationFailedReplication']
                              }]
                          }
                      )
                  send(event, context, 'SUCCESS')
              except Exception as e:
                  print(f"Error: {e}")
                  # Don't block stack delete on a cleanup failure.
                  if event['RequestType'] == 'Delete':
                      send(event, context, 'SUCCESS', f"Delete ignored error: {e}")
                  else:
                      send(event, context, 'FAILED', str(e))

  SourceBucketNotification:
    Type: AWS::CloudFormation::CustomResource
    Condition: HasSourceBucket
    DependsOn: ReplicationQueueMyQueuePolicy
    Properties:
      ServiceToken: !GetAtt NotificationConfigFunction.Arn
      SourceBucket: !Ref SourceBucket
      QueueArn: !GetAtt ReplicationQueue.Arn

Outputs:
  ReplicationQueueArn:
    Description: "URL of the replication queue"
    Value: !GetAtt ReplicationQueue.Arn
  StepFunctionsArn:
    Description: "Arn of step function"
    Value: !GetAtt MyStateMachine.Arn
  DynamodbName:
    Description: "Name of DDB"
    Value: !Ref DDBTable

